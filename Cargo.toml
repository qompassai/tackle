[package]
name = "tackle-mcp"
version = "0.3.2"
readme = "README.md"
edition = "2024"
license = "Apache-2.0"
description = "Tackle - live game-editor broker as an MCP stdio server (U1 read core, U2 write core)"

[dependencies]
# rmcp is pinned to the fleet version (D-113 standardization): one
# protocol era only (2026-07-28), era guard in src/guard.rs.
rmcp = { version = "=3.8.0", default-features = false, features = ["server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "io-std", "sync"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tempfile = "3"

# The library and binary keep the pre-rename name: consumers link
# `tackle::` and the installed binary is `tackle` (the package was
# renamed to tackle-mcp for crates.io, whose bare `tackle` is taken).
[lib]
name = "tackle"
path = "src/lib.rs"

[[bin]]
name = "tackle"
path = "src/main.rs"
